<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="AimWeb - 3D Aim Trainer"
    />

    <title>AimWeb - Aim Trainer</title>
  </head>

  <body>
    <div id="game"></div>

    <div id="hud">
      <div id="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Hits: <span id="hits">0</span></div>
        <div>Shots: <span id="shots">0</span></div>
        <div>Accuracy: <span id="accuracy">100%</span></div>
        <div>Time: <span id="time">60.0</span></div>
        <div>FPS: <span id="fps">60</span></div>
      </div>

      <div id="crosshair">
        <div class="crosshair-horizontal"></div>
        <div class="crosshair-vertical"></div>
      </div>

      <div id="start-screen">
        <div class="start-box">
          <h1>AimWeb</h1>
          <p>3D Aim Trainer</p>
          <button id="start-button">CLICK TO START</button>
          <p class="small-text">
            Move your mouse to aim<br />
            Left click to shoot<br />
            ESC to pause
          </p>
        </div>
      </div>

      <div id="pause-screen" class="hidden">
        <div class="pause-box">
          <h1>AimWeb</h1>

          <p>AimWeb Aim Trainer Web Game</p>

          <p>Created By Twisted0097</p>

          <button id="resume-button">RESUME</button>
        </div>
      </div>

      <div id="game-over" class="hidden">
        <div class="game-over-box">
          <h1>TIME'S UP</h1>

          <p>Score: <span id="final-score">0</span></p>
          <p>Accuracy: <span id="final-accuracy">0%</span></p>

          <button id="restart-button">PLAY AGAIN</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
